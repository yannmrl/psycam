<!DOCTYPE html>
<html lang="fr">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--        <link href="styles.css?v=17" rel="stylesheet"/>-->

        <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
        <link rel="manifest" href="manifest.json">

        <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

        <title>Psycam Controls</title>
</head>
<body>

<h1 class="gradient-text">Psycam Controller</h1>

<h1 id="version"></h1>

<div id="panels">

  <div class="panel" id="p0">
    <div class="controls auto" style="margin-top: 20px; margin-bottom: 20px">
      <input id="tokeninput" type="text" placeholder="TOKEN" onkeyup="updatetoken(this)">
    </div>
    
    <div class="controls clast">

        <button id="auto">AUTO</button>

        <button id="flipX">FLIP H</button>

        <button id="flipY">FLIP V</button>

        <button id="clear">CLEAR</button>
    </div>

  </div>

  <div class="panel" id="p1">

    <div class="separator"></div>

    <div class="ediv ediv-color">

        <div class="card">
        <div id="picker"></div>
        
        <div id="color-value">#ffffff</div>
      </div>

    </div>

  </div>

</div>

<div class="controls auto" style="padding: 10px; position: absolute; bottom: 5px; background: none;">
    <button id="tap-button" onclick="tapTempo()">
        -- BPM
    </button>
  </div>
</div>

<script>
  const versionRaw = String(Date.now());
  const version = `${versionRaw.slice(0,2)}.${versionRaw.slice(2,5)}.${versionRaw.slice(5,9)}.${versionRaw.slice(9)}`
  document.write(`
    <link rel="stylesheet" href="styles.css?v=${versionRaw}">
    <script src="control.js?v=${versionRaw}"><\/script>
  `);
  document.getElementById("version").innerHTML = version;
</script>

</body>
</html>
